# 航天器供电故障树审计 —— 纯静态 Web + 一次性 verify 服务
# 宿主机端口通过环境变量 WEB_PORT 配置（默认 8080），例如：
#   WEB_PORT=9090 docker compose up -d --build
services:
  web:
    build:
      context: .
      target: runtime
    image: fta-audit-web:local
    container_name: fta-audit-web
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # 一次性服务：代码测试 → 构建检查 → 吸收律/共享子门/超限场景断言 → HTTP 冒烟，
  # 全部通过后以退出码 0 自行退出；失败则退出码非零。
  #   docker compose build verify && docker compose up --build verify
  verify:
    build:
      context: .
      target: verify
    image: fta-audit-verify:local
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_HOST: web
    restart: "no"
